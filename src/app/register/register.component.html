<div class="register-container">
  <div class="register-box">
    <div class="register-header">
      <h1><i class="fas fa-user-plus"></i> Create Account</h1>
      <p>Join our community today!</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group">
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input id="name" formControlName="name" type="text" class="form-control" placeholder="Full Name"
            [ngClass]="{ 'is-invalid': f['name'].touched && f['name'].errors }" />
        </div>
        <div class="error-messages" *ngIf="f['name'].touched && f['name'].errors">
          <small *ngIf="f['name'].errors?.['required']">Name is required</small>
          <small *ngIf="f['name'].errors?.['minlength']">Name must be at least 3 characters</small>
        </div>
      </div>

      <div class="form-group">
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input id="email" formControlName="email" type="email" class="form-control" placeholder="Email Address"
            [ngClass]="{ 'is-invalid': f['email'].touched && f['email'].errors }" />
        </div>
        <div class="error-messages" *ngIf="f['email'].touched && f['email'].errors">
          <small *ngIf="f['email'].errors?.['required']">Email is required</small>
          <small *ngIf="f['email'].errors?.['email'] || f['email'].errors?.['pattern']">Please enter a valid
            email</small>
        </div>
      </div>

      <div class="form-group">
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input id="password" formControlName="password" type="password" class="form-control" placeholder="Password"
            [ngClass]="{ 'is-invalid': f['password'].touched && f['password'].errors }" />
        </div>
        <div class="error-messages" *ngIf="f['password'].touched && f['password'].errors">
          <small *ngIf="f['password'].errors?.['required']">Password is required</small>
          <small *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</small>
          <small *ngIf="f['password'].errors?.['pattern']">Password must contain letters and numbers</small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="registerForm.invalid">
        <i class="fas fa-user-plus"></i> Register
      </button>

      <div class="login-link">
        Already have an account? <a routerLink="/login">Login here</a>
      </div>
    </form>
  </div>
</div>
